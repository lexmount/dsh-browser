name: assemble-release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the assembled package to npm through Trusted Publishing
        required: true
        type: boolean
        default: true
      npm_tag:
        description: npm distribution tag
        required: true
        type: choice
        options: [next, latest]
        default: next

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: test "$(npm --version)" = '12.0.2'
      - run: npm ci
      - name: Validate release ref
        env:
          REQUEST_PUBLISH: ${{ inputs.publish }}
          REQUEST_NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          if [[ "${GITHUB_REF_TYPE}" != 'tag' || "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release assembly requires running this workflow on tag v${version}" >&2
            exit 1
          fi
          if [[ "${REQUEST_PUBLISH}" == 'true' && "${version}" == *-* && "${REQUEST_NPM_TAG}" == 'latest' ]]; then
            echo 'A pre-release version cannot be published to the latest npm tag' >&2
            exit 1
          fi
      - name: Verify wrapper and published browser-cli assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:check
      - name: Assemble lightweight npm tarball
        run: |
          version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          tarball="lexmount-dsh-browser-${version}.tgz"
          npm pack
          test -f "${tarball}"
          tar -tzf "${tarball}" package/native-source.json package/lib/binary.js package/lib/index.js >/dev/null
          if tar -tzf "${tarball}" | grep -E '(^package/vendor/|/browser-cli(\.exe)?$)'; then
            echo 'npm tarball contains a native browser-cli executable' >&2
            exit 1
          fi
          sha256sum "${tarball}" > SHA256SUMS
      # upload-artifact and download-artifact version independently; their
      # current Node 24 majors are v7 and v8 respectively.
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            lexmount-dsh-browser-*.tgz
            SHA256SUMS
            native-source.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: test "$(npm --version)" = '12.0.2'
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package
      - name: Verify assembled tarball
        working-directory: package
        run: sha256sum --check SHA256SUMS
      - name: Publish through npm Trusted Publishing
        run: npm publish ./package/lexmount-dsh-browser-*.tgz --access public --tag '${{ inputs.npm_tag }}'
      - name: Verify the package is publicly installable
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find package -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo 'Expected exactly one assembled npm tarball' >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          package_spec="$(tar -xOf "${tarball}" package/package.json | node --input-type=module -e "let source = ''; for await (const chunk of process.stdin) source += chunk; const pkg = JSON.parse(source); process.stdout.write(pkg.name + '@' + pkg.version)")"
          registry_root="${RUNNER_TEMP}/published-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          log_file="${RUNNER_TEMP}/npm-publication-check.log"
          mkdir -p "${registry_root}"

          for attempt in $(seq 1 150); do
            attempt_dir="${registry_root}/${attempt}"
            mkdir -p "${attempt_dir}"
            if npm pack "${package_spec}" --ignore-scripts --pack-destination "${attempt_dir}" >"${log_file}" 2>&1; then
              mapfile -t published_tarballs < <(find "${attempt_dir}" -maxdepth 1 -type f -name '*.tgz' -print)
              if [[ "${#published_tarballs[@]}" -ne 1 ]]; then
                echo 'Expected exactly one tarball downloaded from the public npm registry' >&2
                exit 1
              fi
              expected_hash="$(sha256sum "${tarball}" | awk '{print $1}')"
              published_hash="$(sha256sum "${published_tarballs[0]}" | awk '{print $1}')"
              if [[ "${published_hash}" != "${expected_hash}" ]]; then
                echo "Public npm tarball hash mismatch for ${package_spec}" >&2
                exit 1
              fi
              echo "Verified ${package_spec} from the public npm registry: ${published_hash}"
              exit 0
            fi
            if (( attempt % 6 == 0 )); then
              echo "Waiting for npm publish-time scanning: ${package_spec} is not public after $((attempt * 10)) seconds"
            fi
            sleep 10
          done

          cat "${log_file}" >&2
          echo "${package_spec} did not become publicly installable within 25 minutes" >&2
          exit 1

  github-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package
      - name: Verify assembled tarball
        working-directory: package
        run: sha256sum --check SHA256SUMS
      - name: Create matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            package/lexmount-dsh-browser-*.tgz \
            package/SHA256SUMS \
            package/native-source.json \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}"
