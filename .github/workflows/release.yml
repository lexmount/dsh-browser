name: assemble-release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the assembled package to npm through Trusted Publishing
        required: true
        type: boolean
        default: false
      npm_tag:
        description: npm distribution tag
        required: true
        type: choice
        options: [next, latest]
        default: next

permissions:
  contents: read

env:
  BROWSER_CLI_COMMIT: 1c8e949d613eabbfcdb44c45bba8729189c13b97
  RUST_TOOLCHAIN: 1.93.1

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lexmount/browser-cli-rs
          ref: ${{ env.BROWSER_CLI_COMMIT }}
          path: native/browser-cli-rs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy
      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Test native source
        working-directory: native/browser-cli-rs
        run: |
          cargo fmt --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
      - name: Build static Linux binary
        working-directory: native/browser-cli-rs
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Stage artifact
        run: |
          mkdir -p staging
          cp native/browser-cli-rs/target/x86_64-unknown-linux-musl/release/browser-cli staging/browser-cli
          chmod 755 staging/browser-cli
          file staging/browser-cli
          if readelf --program-headers --wide staging/browser-cli | grep -F 'Requesting program interpreter'; then
            echo 'Linux release binary is dynamically linked' >&2
            exit 1
          fi
          staging/browser-cli version
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: staging/browser-cli
          if-no-files-found: error

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lexmount/browser-cli-rs
          ref: ${{ env.BROWSER_CLI_COMMIT }}
          path: native/browser-cli-rs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - name: Test native source
        working-directory: native/browser-cli-rs
        run: cargo test --all-targets --locked
      - name: Build Windows binary
        working-directory: native/browser-cli-rs
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          cp native/browser-cli-rs/target/x86_64-pc-windows-msvc/release/browser-cli.exe staging/browser-cli.exe
          staging/browser-cli.exe version
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: staging/browser-cli.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_target: darwin-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-14
          - package_target: darwin-x64
            rust_target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: macos-release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lexmount/browser-cli-rs
          ref: ${{ env.BROWSER_CLI_COMMIT }}
          path: native/browser-cli-rs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}
      - name: Test native source
        working-directory: native/browser-cli-rs
        run: cargo test --all-targets --locked
      - name: Build macOS binary
        working-directory: native/browser-cli-rs
        run: cargo build --release --locked --target '${{ matrix.rust_target }}'
      - name: Sign and notarize
        working-directory: native/browser-cli-rs
        env:
          MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: ./scripts/sign_and_notarize_macos.sh 'target/${{ matrix.rust_target }}/release/browser-cli'
      - name: Stage artifact
        run: |
          mkdir -p staging
          cp 'native/browser-cli-rs/target/${{ matrix.rust_target }}/release/browser-cli' staging/browser-cli
          chmod 755 staging/browser-cli
          codesign --verify --strict --verbose=4 staging/browser-cli
          file staging/browser-cli
          staging/browser-cli version
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.package_target }}
          path: staging/browser-cli
          if-no-files-found: error

  assemble:
    needs: [linux-x64, windows-x64, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm --version
      - run: npm ci
      - run: npm run check
      - name: Validate release ref
        env:
          REQUEST_PUBLISH: ${{ inputs.publish }}
          REQUEST_NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          if [[ "${REQUEST_PUBLISH}" == 'true' ]] && { [[ "${GITHUB_REF_TYPE}" != 'tag' ]] || [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; }; then
            echo "Publishing requires running this workflow on tag v${version}" >&2
            exit 1
          fi
          if [[ "${REQUEST_PUBLISH}" == 'true' && "${version}" == *-* && "${REQUEST_NPM_TAG}" == 'latest' ]]; then
            echo 'A pre-release version cannot be published to the latest npm tag' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: artifacts/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-x64
          path: artifacts/win32-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64
          path: artifacts/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-x64
          path: artifacts/darwin-x64
      - name: Stage all native binaries
        run: |
          node scripts/stage-binary.mjs --target linux-x64 --source artifacts/linux-x64/browser-cli
          node scripts/stage-binary.mjs --target win32-x64 --source artifacts/win32-x64/browser-cli.exe
          node scripts/stage-binary.mjs --target darwin-arm64 --source artifacts/darwin-arm64/browser-cli
          node scripts/stage-binary.mjs --target darwin-x64 --source artifacts/darwin-x64/browser-cli
      - run: npm run release:check
      - name: Assemble npm tarball
        run: |
          version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          tarball="lexmount-dsh-browser-${version}.tgz"
          npm pack
          test -f "${tarball}"
          for entry in \
            package/vendor/manifest.json \
            package/vendor/linux-x64/browser-cli \
            package/vendor/win32-x64/browser-cli.exe \
            package/vendor/darwin-arm64/browser-cli \
            package/vendor/darwin-x64/browser-cli; do
            tar -tzf "${tarball}" "${entry}" >/dev/null
          done
          sha256sum "${tarball}" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            lexmount-dsh-browser-*.tgz
            SHA256SUMS
            vendor/manifest.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm --version
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - name: Verify assembled tarball
        working-directory: package
        run: sha256sum --check SHA256SUMS
      - name: Publish through npm Trusted Publishing
        run: npm publish package/lexmount-dsh-browser-*.tgz --access public --tag '${{ inputs.npm_tag }}'

  github-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - name: Verify assembled tarball
        working-directory: package
        run: sha256sum --check SHA256SUMS
      - name: Create matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            package/lexmount-dsh-browser-*.tgz \
            package/SHA256SUMS \
            package/vendor/manifest.json \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}"
