name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22.14.0, 22.22.2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:verify
      - name: Verify native source pin
        run: |
          node --input-type=module -e "import source from './native-source.json' with { type: 'json' }; if (source.commit !== '952a5e53ff9dd3980342d4dae7f860f80b39a100' || source.version !== '1.1.15') process.exit(1)"
      - name: Verify Bundle manifest
        run: |
          node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; if (pkg.dsh?.bundle?.patch !== './cordis.patch.yml') process.exit(1)"
      - name: Verify release trigger contract
        run: |
          grep -Fq 'tags: ["v*"]' .github/workflows/release.yml
          ! grep -q 'workflow_dispatch' .github/workflows/release.yml
          ! grep -q 'inputs\.' .github/workflows/release.yml
          grep -Fq 'npm_tag=next' .github/workflows/release.yml
          grep -Fq 'npm_tag=latest' .github/workflows/release.yml
          grep -Fq 'needs.assemble.outputs.npm_tag' .github/workflows/release.yml
